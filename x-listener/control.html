<!doctype html>
<html><head><meta charset="utf-8"><title>X Chat Listener</title>
<style>
  body{margin:0;background:#0e0e1c;color:#eee;font-family:'Segoe UI',system-ui,sans-serif;padding:18px}
  h1{font-size:15px;margin:0 0 4px}
  p{font-size:11px;color:#8a8aa5;margin:0 0 14px;line-height:1.5}
  input{width:100%;box-sizing:border-box;background:#0a0a0f;border:1px solid #2a2a3a;border-radius:8px;padding:9px 11px;color:#eee;font-size:13px;outline:none}
  button{margin-top:10px;width:100%;background:linear-gradient(135deg,#1d9bf0,#0f6fb8);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
  .status{margin-top:14px;font-size:12px;color:#8a8aa5}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#444;margin-right:6px}
  .on{background:#22c55e;box-shadow:0 0 6px #22c55e}
</style></head>
<body>
  <h1>✖ X Chat Listener</h1>
  <p>Enter the streamer's X username. A window opens with their live chat — log into X there once. Keep this app open; the dashboard pulls the messages automatically.</p>
  <input id="ch" placeholder="username (e.g. AviFelman)" />
  <button id="go">Start listening</button>
  <div class="status"><span class="dot" id="dot"></span><span id="msg">Not listening yet</span></div>
  <script>
    const ch=document.getElementById('ch'), go=document.getElementById('go'), dot=document.getElementById('dot'), msg=document.getElementById('msg')
    go.onclick=async()=>{ const v=ch.value.trim(); if(!v)return; await window.listener.setChannel(v); }
    ch.addEventListener('keydown',e=>{ if(e.key==='Enter') go.click() })
    setInterval(async()=>{ try{ const s=await window.listener.getStatus(); if(s.listening){ dot.classList.add('on'); msg.textContent='Listening to @'+s.channel+' · '+s.count+' messages read' } else { dot.classList.remove('on'); msg.textContent='Not listening yet' } }catch(_){}}, 1000)
  </script>
</body></html>
